name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SESSION_SECRET: ci-session-secret-at-least-32-bytes-long
          ALLOW_DEMO_MODE: "true"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
